<div id="inner-body">
    <h1>peRsonAl pRojects</h1>
    <div nz-row [nzGutter]="{ xs: 8, sm: 16, md: 24, lg: 32, xl: 32, xxl: 32 }">
        <div nz-col class="gutter-row" [nzXs]="24" [nzSm]="12" [nzMd]="8" [nzLg]="6" *ngFor="let project of projects">
            <app-image-card-component [imageDetail]="project.image"
                                    [name]="project.name"
                                    [description]="project.description"
                                    [routerLink]="project.route"></app-image-card-component>
        </div>
    </div>
</div>
